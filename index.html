<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MD Clicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ole&display=swap" rel="stylesheet">
</head>
<body>
    <div class="PaginaInicial">
        <h1>MD CLICKER</h1>
        <div id="LoginDiv" class="inline">
            <input id="emailL" type="text" placeholder="Email">
            <input id="senhaL" type="password" placeholder="Senha">
        </div>
        <div id="CadastrarDiv" class="inline">
            <input id="userC" type="text" placeholder="User">
            <input id="emailC" type="text" placeholder="Email">
            <input id="senhaC" type="password" placeholder="Senha">
        </div>
        
        <button id="Login">Jogar</button>
        <button id="Cadastre-se">Cadastre-se</button>
        <button id="Cadastrar">Cadastrar</button>
        <br>
        <button id="backcad">Voltar</button>
    </div>
    <div class="GameDiv">
        <div class="Config">
            <div class="configE">
                <p>Configurações</p>
            </div>
        </div>
        <div class="container">
            <h1 id="pontos">0</h1>
            <h1 id="mdcoins">MDCOINS</h1>
            <div class="VC">
                <p>Click</p> <p>:</p> <p class="SCV"> </p>
            </div>
            <img src="https://i.ibb.co/9kgt8N1K/ERIBJ.jpg" alt="batata" id="buttonclicker">
        </div>
        <div class="Stage">

        </div>
        <div class="upgradeMenu">
             <h1>Upgrades</h1>
             <div id="BtnsUPGM" class="Click">
                <p>Click</p>
                <div id="" class="hoverdiv">
                    <p>Value:</p> <p class="priceClickUPG"> </p>
                 </div>
             </div>
             <div id="BtnsUPGM" class="A">
                <p>A</p>
            </div>
            <div id="BtnsUPGM" class="">
            </div>
        </div>
     </div>
    </div>
</body>
<script src="script.js"></script>
</html>
