<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MD Clicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ole&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nabla&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>
    <div class="PaginaInicial">
        <div class="spotlight" aria-hidden="true"></div>

        <div class="marquee">
            <h1>MD CLICKER</h1>
            <p class="eyebrow">✦ Acesso Backstage ✦</p>
        </div>

        <div class="ticket-stub">
            <span class="ticket-hole"></span>
            <p class="ticket-kicker">Passe All Access · Não Transferível</p>

            <div id="LoginDiv" class="inline ticket-fields">
                <label class="field">
                    <span>Email</span>
                    <input id="emailL" type="text" placeholder="seu@email.com">
                </label>
                <label class="field">
                    <span>Senha</span>
                    <input id="senhaL" type="password" placeholder="••••••••">
                </label>
            </div>

            <div id="CadastrarDiv" class="inline ticket-fields">
                <label class="field">
                    <span>Artista</span>
                    <input id="userC" type="text" placeholder="Seu nome de palco">
                </label>
                <label class="field">
                    <span>Email</span>
                    <input id="emailC" type="text" placeholder="seu@email.com">
                </label>
                <label class="field">
                    <span>Senha</span>
                    <input id="senhaC" type="password" placeholder="••••••••">
                </label>
            </div>

            <div class="tear-line" aria-hidden="true"></div>

            <div class="ticket-actions">
                <button id="Login">Entrar no Show</button>
                <button id="Cadastrar">Confirmar Acesso</button>
                <button id="Cadastre-se">Sem ingresso? Cadastre-se</button>
                <button id="backcad">← Voltar pro login</button>
            </div>

            <div class="barcode" aria-hidden="true"></div>
        </div>
    </div>
    <div class="GameDiv">
        <div class="Config">
            <div class="configE">
                <p>Configurações</p>
            </div>
            <button id="RankingBtn" class="RankingBtn" title="Ver Ranking">🏆</button>
        </div>

        <div id="RankingOverlay" class="ranking-overlay">
            <div class="ranking-box">
                <button id="RankingClose" class="ranking-close">✕</button>
                <h2 class="ranking-title">🏆 Ranking</h2>
                <div id="RankingLista" class="ranking-lista">
                    <p class="ranking-vazio">Carregando ranking...</p>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="canhaoDnevoa">
                <p>Canhão de Névoa</p>
                <p>:</p>
                <p class="CDN"> </p>
                <p>/10</p>
            </div>
            <h1 id="pontos">0</h1>
            <h1 id="mdcoins">MDCOINS</h1>
            <div class="VC">
                <p>Click</p>
                <p>:</p>
                <p class="SCV"> </p>
            </div>
            <img src="Assets/1.png" alt="batata" id="buttonclicker">
        </div>
        <div class="Stage">
            <img class="OruamPNG" src="https://i.ibb.co/ZP5hdWf/oruam-1.png" alt="">
            <img class="OruamPNG" src="https://i.ibb.co/ZP5hdWf/oruam-1.png" alt="">
        </div>
        <div class="upgradeMenu">
            <h1>Upgrades</h1>
            <div id="BtnsUPGM" class="Click">
                <p>CLICK</p>
                <div id="" class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceClickUPG"> </p>
                </div>
            </div>
            <div id="BtnsUPGM" class="Foguetes">
                <p>FOGUETES</p>
                <div id="fogueteshover" class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceFoguetesUPG"> </p>
                </div>
            </div>
            <div id="BtnsUPGM" class="Fumacas">
                <p>FUMAÇAS</p>
                <div id="fumacashover" class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceFumacasUPG"> </p>
                </div>
            </div>
            <div id="BtnsUPGM" class="Oruam">
                <p>ORUAM</p>
                <div id="oruamhover" class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceOruamUPG"> </p>
                </div>
            </div>
            <div id="BtnsUPGM" class="Rebirth">
                <p>REBIRTH</p>
                <div id="rebirthhover" class="hoverdiv">
                    <p>Value:</p>
                    <p class="priceRebirthUPG"> </p>
                </div>
            </div>
        </div>
    </div>
    </div>
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <button id="btn-guest" class="modal-btn">Jogar como Convidado</button>
            <button id="btn-login" class="modal-btn">Login / Cadastro</button>
        </div>
    </div>
</body>
<script src="script.js"></script>

</html>
</html>
